<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Rounded Head (pivot neck at 40, 68) -->
  <circle cx="40" cy="40" r="26" fill="#F5F5F5" stroke="#121212" stroke-width="2.5"/>

  <!-- Left Ear with signature notch -->
  <path d="M20 28 L24 4 C26 2 28 2 29 4 L38 18 Z" fill="#F5F5F5" stroke="#121212" stroke-width="2.5"/>
  <path d="M23 24 L26 8 L33 18 Z" fill="rgba(0, 0, 0, 0.10)"/>

  <!-- Right Ear with signature notch -->
  <path d="M42 18 L51 2 C53 1 55 2 56 4 L60 28 Z" fill="#F5F5F5" stroke="#121212" stroke-width="2.5"/>
  <path d="M45 18 L52 7 L56 24 Z" fill="rgba(0, 0, 0, 0.10)"/>

  <!-- Muzzle, nose & mouth (eyeless base; eyes layer on top) -->
  <polygon points="39,43 41,43 40,44.5" fill="#121212"/>
  <path d="M37 46 Q40 48 43 46" fill="none" stroke="#121212" stroke-width="1" stroke-linecap="round"/>

  <!-- Whisker Glints -->
  <g stroke="#121212" stroke-width="0.8" stroke-linecap="round" opacity="0.35">
    <line x1="22" y1="44" x2="12" y2="42"/>
    <line x1="22" y1="47" x2="13" y2="49"/>
    <line x1="58" y1="44" x2="68" y2="42"/>
    <line x1="58" y1="47" x2="67" y2="49"/>
  </g>
</svg>
