<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="2560" height="1160" fill="#141414"/>

  <!-- Architectural Doorway (Mono lines) -->
  <rect x="1760" y="120" width="600" height="1040" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>
  <rect x="1790" y="150" width="540" height="1010" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
  <line x1="1790" y1="680" x2="2330" y2="680" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Mid-tone Floor -->
  <rect y="1160" width="2560" height="440" fill="url(#floorGrad)"/>
  <line x1="0" y1="1160" x2="2560" y2="1160" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Floor Planks -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="1250" x2="2560" y2="1250"/>
    <line x1="0" y1="1360" x2="2560" y2="1360"/>
    <line x1="0" y1="1480" x2="2560" y2="1480"/>
    <line x1="400" y1="1160" x2="260" y2="1600"/>
    <line x1="1000" y1="1160" x2="860" y2="1600"/>
    <line x1="1600" y1="1160" x2="1460" y2="1600"/>
    <line x1="2200" y1="1160" x2="2060" y2="1600"/>
  </g>

  <!-- Friendly Casper Sitting by the Doorway -->
  <g transform="translate(1960, 1030) scale(1.35)">
    <!-- Floor Shadow -->
    <ellipse cx="50" cy="184" rx="65" ry="16" fill="rgba(0, 0, 0, 0.45)"/>

    <!-- Curled Friendly Tail -->
    <path d="M88 172 C135 184 140 156 126 142 C118 134 110 140 114 150 C118 162 108 170 82 165 Z"
          fill="#F5F5F5" stroke="none" stroke-width="0" stroke-linejoin="round"/>

    <!-- Rounded Pear-shaped Body -->
    <path d="M22 176 C12 135 28 92 48 68 C58 56 74 56 84 68 C104 92 120 135 110 176 C102 188 30 188 22 176 Z"
          fill="#F5F5F5" stroke="none" stroke-width="0" stroke-linejoin="round"/>

    <!-- Soft Front Paws -->
    <ellipse cx="48" cy="180" rx="10" ry="7" fill="#F5F5F5" stroke="none" stroke-width="0"/>
    <ellipse cx="70" cy="180" rx="10" ry="7" fill="#F5F5F5" stroke="none" stroke-width="0"/>

    <!-- Friendly Rounded Head -->
    <circle cx="58" cy="50" r="26" fill="#F5F5F5" stroke="none" stroke-width="0"/>

    <!-- Left Ear with signature notch -->
    <path d="M38 38 L42 14 C44 12 46 12 47 14 L56 28 Z" fill="#F5F5F5" stroke="none" stroke-width="0"/>
    <path d="M41 34 L44 18 L51 28 Z" fill="rgba(0, 0, 0, 0.08)"/>

    <!-- Right Ear with signature notch -->
    <path d="M60 28 L69 12 C71 11 73 12 74 14 L78 38 Z" fill="#F5F5F5" stroke="none" stroke-width="0"/>
    <path d="M63 28 L70 17 L74 34 Z" fill="rgba(0, 0, 0, 0.08)"/>

    <!-- Eyes and sweet expression -->
    <ellipse cx="50" cy="46" rx="2.5" ry="3.5" fill="#222222"/>
    <ellipse cx="66" cy="46" rx="2.5" ry="3.5" fill="#222222"/>
    <polygon points="57,53 59,53 58,54.5" fill="#222222"/>
    <path d="M55 56 Q58 58 61 56" fill="none" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
